name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
      dry_run:
        description: "Run validation and npm publish --dry-run without publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  CODEX_CLI_VERSION: 0.139.0

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Release validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG}" != "v${package_version}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package version v${package_version}" >&2
            exit 1
          fi

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Package smoke
        run: bun run test:package-smoke

      - name: Install Codex CLI
        run: npm install --global "@openai/codex@${CODEX_CLI_VERSION}"

      - name: Record Codex CLI version
        run: codex --version

      - name: Test real Codex E2E
        run: |
          set -o pipefail
          bun run test:e2e:codex 2>&1 | tee real-codex-e2e.log

      - name: Upload real Codex E2E failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-real-codex-e2e-log
          path: real-codex-e2e.log
          if-no-files-found: ignore
          retention-days: 7

  npm:
    name: Publish npm package
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG}" != "v${package_version}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package version v${package_version}" >&2
            exit 1
          fi

      - name: Publish dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --dry-run --provenance --access public

      - name: Publish to npm
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published; skipping npm publish."
            exit 0
          fi
          npm publish --provenance --access public
