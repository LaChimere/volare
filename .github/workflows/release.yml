name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
      dry_run:
        description: "Run validation and npm publish --dry-run without publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Set up Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG}" != "v${package_version}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package version v${package_version}" >&2
            exit 1
          fi

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build standalone binary
        run: bun run package

      - name: Smoke-test packed CLI with bunx
        run: |
          packed_package="$(npm pack --silent)"
          packed_name="$(basename "${packed_package}")"
          smoke_dir="$(mktemp -d)"
          cp "${packed_package}" "${smoke_dir}/${packed_name}"
          (
            cd "${smoke_dir}"
            bun install "./${packed_name}"
            bunx --bun volare help
          )

      - name: Publish dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --dry-run --provenance --access public

      - name: Publish to npm
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published; skipping npm publish."
            exit 0
          fi
          npm publish --provenance --access public
