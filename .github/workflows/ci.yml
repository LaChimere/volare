name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.128.0

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build standalone binary
        run: bun run package

      - name: Check npm package contents
        run: npm pack --dry-run

      - name: Smoke-test packed CLI with bunx
        run: |
          packed_package="$(npm pack --silent)"
          packed_name="$(basename "${packed_package}")"
          smoke_dir="$(mktemp -d)"
          cp "${packed_package}" "${smoke_dir}/${packed_name}"
          (
            cd "${smoke_dir}"
            bun install "./${packed_name}"
            bunx --bun volare help
          )
